<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .logo img {
      height: 60px;
      width: auto;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #34495e;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      transition: background 0.3s;
    }
    nav a:hover {
      background: #1abc9c;
    }
    main {
      flex: 1; /* pushes footer down */
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 {
      color: #2c3e50;
    }
    input, select, button {
      padding: 10px;
      margin: 8px 0;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #1abc9c;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background: #16a085;
    }
    .doctor-list div {
      padding: 10px;
      border-bottom: 1px solid #eee;
      transition: background 0.3s;
    }
    .doctor-list div:hover {
      background: #ecf0f1;
    }
    .billing-output {
      font-weight: bold;
      color: #e74c3c;
    }
    footer {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="https://img.magnific.com/premium-vector/medical-logo-template_775582-9775.jpg?semt=ais_hybrid&w=740&q=80" alt="Hospital Logo">
      <h1>Hospital Management System</h1>
    </div>
  </header>

  <nav>
    <a href="#patients">Patients</a>
    <a href="#doctors">Doctors</a>
    <a href="#appointments">Appointments</a>
    <a href="#billing">Billing</a>
  </nav>

  <main>
    <!-- Patient Registration -->
    <div class="card" id="patients">
      <h2>Patient Registration</h2>
      <form id="patientForm">
        <input type="text" id="pname" placeholder="Patient Name" required>
        <input type="number" id="page" placeholder="Age" required>
        <select id="pgender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>
        <button type="submit">Register Patient</button>
      </form>
      <p id="patientOutput"></p>
    </div>

    <!-- Doctor List -->
    <div class="card" id="doctors">
      <h2>Doctors</h2>
      <div class="doctor-list">
        <div>Dr. Sandip – Cardiologist</div>
        <div>Dr. Kumar – Neurologist</div>
        <div>Dr. Patel – Orthopedic</div>
        <div>Dr. Lee – Pediatrician</div>
      </div>
    </div>

    <!-- Appointment Booking -->
    <div class="card" id="appointments">
      <h2>Book Appointment</h2>
      <form id="appointmentForm">
        <input type="text" id="aname" placeholder="Patient Name" required>
        <select id="adoctor">
          <option value="">Select Doctor</option>
          <option>Dr. Sandip</option>
          <option>Dr. Kumar</option>
          <option>Dr. Patel</option>
          <option>Dr. Lee</option>
        </select>
        <input type="date" id="adate" required>
        <button type="submit">Book Appointment</button>
      </form>
      <p id="appointmentOutput"></p>
    </div>

    <!-- Billing -->
    <div class="card" id="billing">
      <h2>Billing</h2>
      <input type="number" id="consultation" placeholder="Consultation Fee">
      <input type="number" id="medication" placeholder="Medication Cost">
      <button onclick="calculateBill()">Generate Bill</button>
      <p class="billing-output" id="billOutput"></p>
    </div>
  </main>

  <footer>
    copyright &copy; 2026 | All rights reserved
  </footer>

  <script>
    // Patient Registration
    document.getElementById("patientForm").addEventListener("submit", function(e){
      e.preventDefault();
      let name = document.getElementById("pname").value;
      let age = document.getElementById("page").value;
      let gender = document.getElementById("pgender").value;
      document.getElementById("patientOutput").innerText =
        "Registered Patient: " + name + " (" + age + ", " + gender + ")";
    });

    // Appointment Booking
    document.getElementById("appointmentForm").addEventListener("submit", function(e){
      e.preventDefault();
      let name = document.getElementById("aname").value;
      let doctor = document.getElementById("adoctor").value;
      let date = document.getElementById("adate").value;
      document.getElementById("appointmentOutput").innerText =
        "Appointment booked for " + name + " with " + doctor + " on " + date;
    });

    // Billing Calculation
    function calculateBill(){
      let consultation = parseFloat(document.getElementById("consultation").value) || 0;
      let medication = parseFloat(document.getElementById("medication").value) || 0;
      let total = consultation + medication;
      document.getElementById("billOutput").innerText = "Total Bill: ₹" + total;
    }
  </script>
</body>
</html>
